[build-system]
requires = [
    "hatchling==1.29.0",
    "hatch-vcs==0.5.0",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true

[tool.hatch.build.hooks.vcs]
version-file = "src/answer_service/_version.py"

[project]
name = "answer-service"
dynamic = ["version"]
description = "Answering service for Education Platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "Danil Kovalev", email = "dan.kovalev2013@gmail.com" },
]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

requires-python = ">=3.12"

dependencies = [
    "adaptix==3.0.0b12",
    "alembic>=1.18.4",
    "asyncpg==0.31.0",
    "bazario==0.4.2",
    "dishka==1.9.1",
    "dishka-faststream==0.6.0",
    "fastapi==0.135.3",
    "faststream[rabbit]==0.6.7",
    "langchain==1.2.15",
    "langchain-chroma==1.1.0",
    "langchain-openai==1.1.12",
    "python-multipart==0.0.26",
    "sqlalchemy[asyncio]==2.0.49",
    "structlog==25.5.0",
    "uvicorn==0.44.0",
    "uvloop==0.22.1; sys_platform != 'win32'",
    "taskiq>=0.12.1",
    "taskiq-aio-pika>=0.6.0",
    "taskiq-redis>=1.2.2",
]

[project.urls]
Source = "https://github.com/morrs1/EducationPlatform"
Homepage = "https://github.com/morrs1/EducationPlatform"
Tracker = "https://github.com/morrs1/EducationPlatform/issues"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    "prek>=0.3.8",
]
lint = [
    "bandit>=1.9.4",
    "codespell>=2.4.2",
    "mypy>=1.20.1",
    "ruff>=0.15.10",
    "semgrep>=1.159.0",
    "zizmor>=1.24.0",
    "import-linter>=2.11",
]
test = [
    "httpx>=0.28.1",
    "nox>=2026.4.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mypy>=1.0.1",
    "testcontainers[postgres]>=4.14.2",
    "coverage>=7.13.5"
]

[tool.bandit]
skips = ["B101"]

[tool.typos.default.extend-words]
selectin = "selectin"
