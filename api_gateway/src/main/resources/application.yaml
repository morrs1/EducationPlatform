spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: api_gateway

server:
  port: ${API_GATEWAY_SERVER_PORT:8090}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

auth:
  user-service:
    base-uri: ${API_GATEWAY_USER_SERVICE_URI:http://localhost:8080}
  jwt:
    # Only a dev default. MUST be overridden via API_GATEWAY_JWT_SECRET in prod.
    secret: ${API_GATEWAY_JWT_SECRET:dev-secret-change-me-at-least-32-chars}
    ttl: ${API_GATEWAY_JWT_TTL:15m}

gateway:
  proxy:
    entry-path-prefix: ${API_GATEWAY_ENTRY_PATH_PREFIX:/api}
  # Path prefixes are part of the public contract — kept in code.
  # Target hosts are environment-specific — injected via API_GATEWAY_*_URI.
  routes:
    # Longest prefix first so /api/course/lesson wins over /api/course.
    - id: course-lesson
      path-prefix: /api/course/lesson
      target-base-uri: ${API_GATEWAY_COURSE_SERVICE_URI:http://localhost:8081}
      strip-prefix: /api
    - id: course
      path-prefix: /api/course
      target-base-uri: ${API_GATEWAY_COURSE_SERVICE_URI:http://localhost:8081}
      strip-prefix: /api
    - id: learning
      path-prefix: /api/learning
      target-base-uri: ${API_GATEWAY_LEARNING_SERVICE_URI:http://localhost:8082}
      strip-prefix: /api
    - id: user
      path-prefix: /api/user
      target-base-uri: ${API_GATEWAY_USER_SERVICE_URI:http://localhost:8080}
      strip-prefix: /api
