# Install: `pre-commit install && pre-commit install --hook-type pre-push`

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        files: ^user_service/.*\.ya?ml$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: spotless-check
        name: Spotless format check (user_service)
        entry: bash -c 'cd user_service && ./gradlew --no-daemon --quiet spotlessCheck'
        language: system
        files: ^user_service/.*\.(java|kts|md)$
        pass_filenames: false

      - id: checkstyle-main
        name: Checkstyle (main + test + integrationTest)
        entry: bash -c 'cd user_service && ./gradlew --no-daemon --quiet checkstyleMain checkstyleTest checkstyleIntegrationTest'
        language: system
        files: ^user_service/.*\.java$
        pass_filenames: false

      - id: gradle-test
        name: Gradle unit tests (user_service)
        entry: bash -c 'cd user_service && ./gradlew --no-daemon --quiet test'
        language: system
        files: ^user_service/.*\.(java|kts)$
        pass_filenames: false
        stages: [pre-push]
