spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: user_service
  datasource:
    url: jdbc:postgresql://${USER_SERVICE_POSTGRES_HOST:localhost}:${USER_SERVICE_POSTGRES_EXTERNAL_PORT:5435}/${USER_SERVICE_POSTGRES_DB:user_service_db}
    username: ${USER_SERVICE_POSTGRES_USER:morrs}
    password: ${USER_SERVICE_POSTGRES_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: ${USER_SERVICE_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${USER_SERVICE_MULTIPART_MAX_REQUEST_SIZE:10MB}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# The S3 subsystem is provisional — the Spring property prefix stays `temp.s3.*`
# (referenced from Java via @Value("${temp.s3.*}")). The env vars are namespaced
# under USER_SERVICE_S3_* to align with the monorepo convention.
temp:
  s3:
    enabled: ${USER_SERVICE_S3_ENABLED:false}
    region: ${USER_SERVICE_S3_REGION:eu-central-1}
    bucket: ${USER_SERVICE_S3_BUCKET:}
    endpoint: ${USER_SERVICE_S3_ENDPOINT:}
    access-key: ${USER_SERVICE_S3_ACCESS_KEY:}
    secret-key: ${USER_SERVICE_S3_SECRET_KEY:}
    public-base-url: ${USER_SERVICE_S3_PUBLIC_BASE_URL:}
    path-style-access: ${USER_SERVICE_S3_PATH_STYLE_ACCESS:false}

server:
  port: ${USER_SERVICE_SERVER_PORT:8080}
