services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.19
    container_name: user-service-seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_S3_ACCESS_KEY:-seaweedfs-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_S3_SECRET_KEY:-seaweedfs-admin-secret}
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - ./data/seaweedfs:/data
    command: >
      server
      -dir=/data
      -ip.bind=0.0.0.0
      -s3

  s3-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.34.7
    container_name: user-service-seaweedfs-init
    restart: "no"
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_S3_ACCESS_KEY:-seaweedfs-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_S3_SECRET_KEY:-seaweedfs-admin-secret}
      AWS_DEFAULT_REGION: ${SEAWEED_S3_REGION:-us-east-1}
      SEAWEED_S3_BUCKETS: ${SEAWEED_S3_BUCKETS:-user-service-local,course-service-local}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        aws configure set default.s3.addressing_style path

        until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do
          echo "Waiting for SeaweedFS S3 on http://seaweedfs:8333 ..."
          sleep 2
        done

        OLD_IFS="$$IFS"
        IFS=','
        for bucket in $$SEAWEED_S3_BUCKETS; do
          if [ -z "$$bucket" ]; then
            continue
          fi

          if aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1; then
            echo "Bucket '$$bucket' already exists"
          else
            echo "Creating bucket '$$bucket'"
            aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "$$bucket"
          fi
        done
        IFS="$$OLD_IFS"

        aws --endpoint-url http://seaweedfs:8333 s3api list-buckets
