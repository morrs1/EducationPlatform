spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: course_service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_EXTERNAL_PORT:5435}/${POSTGRES_DB:course_service}
    username: ${POSTGRES_USER:morrs}
    password: ${POSTGRES_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8081